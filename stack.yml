services:
  boodschappen:
    image: ghcr.io/richrdj/boodschappenlijst:latest
    ports:
      - "2020:8080"
    volumes:
      - boodschappen-data:/data
    environment:
      # wachtwoord voor de app; laat leeg of haal weg om zonder inloggen te werken
      - APP_PASSWORD=
    restart: unless-stopped

volumes:
  boodschappen-data:
