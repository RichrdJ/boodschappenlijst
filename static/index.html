<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A4FA3">
<title>Boodschappen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#16212C; --muted:#6B7785; --line:#D5DCE3;
  --route:#0A4FA3; --marker:#FFD23F; --danger:#A3261E; --danger-bg:#FCE8E6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F161D;--surface:#18222C;--ink:#E8EDF2;--muted:#8D9AA8;--line:#2A3642;--route:#5B9BEA;--danger:#FFB4AC;--danger-bg:#3A1E1C}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
/* geen dubbeltik-zoom op iOS bij snel afvinken; knijpen om te zoomen blijft werken */
html,button,input,select,a{touch-action:manipulation}
button{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);
  font:17px/1.4 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.settings{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:20px 20px 8px;max-width:640px;margin:0 auto}
h1{font-size:28px;margin:0;letter-spacing:-.01em}
.head-r{display:flex;align-items:center;gap:12px}
.count{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:4px;max-width:640px;margin:0 auto 12px;padding:4px;background:var(--line);border-radius:14px;width:calc(100% - 32px)}
.tab{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700}
main{max-width:640px;margin:0 auto;padding:4px 16px 0}

.route{position:relative;padding-left:30px}
.route::before{content:"";position:absolute;left:10px;top:14px;bottom:14px;width:4px;border-radius:2px;background:var(--route);opacity:.25}
.stop{position:relative;margin-bottom:18px}
.stop>h2{position:relative;font-size:15px;font-weight:700;margin:0 0 6px;padding-top:4px;color:var(--muted)}
.stop>h2::before{content:"";position:absolute;left:-26px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--cat);border:3px solid var(--bg)}
.stop.done>h2::before{background:var(--line)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:0 14px 14px 0;overflow:hidden;border-left:4px solid var(--cat)}
.list li{display:flex;align-items:center;min-height:52px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.check{flex:1;display:flex;align-items:center;gap:14px;padding:12px 14px;background:none;border:0;text-align:left;min-width:0}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
li.checked .box{background:var(--cat);border-color:var(--cat)}
li.leaving{opacity:0;transition:opacity .3s .15s}
li.checked .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.name{overflow-wrap:anywhere}
li.checked .name{text-decoration:line-through;color:var(--muted)}
.more{flex:none;width:48px;height:52px;background:none;border:0;color:var(--muted);font-size:22px}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty strong{display:block;color:var(--ink);font-size:20px;margin-bottom:4px}
.day{margin-bottom:22px}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 6px}
.day-h h2{font-size:17px;margin:0}
.day-h small{color:var(--muted);font-size:14px}
.again{background:none;border:0;color:var(--route);font-size:15px;font-weight:700;padding:6px 0}
.hrow .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--cat)}
.hrow .t{flex:none;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.hrow .ic.plus{color:var(--route);font-size:22px}

#form{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
body.settings #form{display:none}
.bar{display:flex;gap:10px;max-width:640px;margin:0 auto}
input,select{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--route)}
.sugs{display:flex;gap:8px;overflow-x:auto;max-width:640px;margin:0 auto;padding:0 0 10px;scrollbar-width:none}
.sugs:empty{display:none}
.sugs::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;border-radius:999px;border:2px solid var(--line);background:var(--bg);max-width:70vw}
.chip.hl{border-color:var(--route)}
.chip.on-list{opacity:.55}
.chip-add{display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px 4px 8px 12px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-add i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--cat)}
.chip-add b{font-weight:700}
.chip-x{background:none;border:0;color:var(--muted);padding:8px 12px 8px 6px;font-size:14px}
.sug-label{flex:none;align-self:center;color:var(--muted);font-size:14px;padding-right:2px}
.add{flex:none;width:54px;border:0;border-radius:12px;background:var(--marker);color:#16212C;font-size:28px;font-weight:700}
button:focus-visible{outline:3px solid var(--route);outline-offset:2px}

/* Instellingen */
.sec{margin-bottom:28px}
.sec h2{font-size:20px;margin:0 0 4px}
.sec>p{margin:0 0 12px;color:var(--muted);font-size:15px}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.rows li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.sw{flex:none;width:34px;height:34px;padding:0;border-radius:50%;border:3px solid var(--surface);background:var(--cat);outline:2px solid var(--line)}
.rows input,.rows select{padding:9px 10px}
.ic{flex:none;width:38px;height:38px;border-radius:10px;border:0;background:var(--bg);font-size:18px}
.ic:disabled{opacity:.3;cursor:default}
.ic.x{color:var(--danger)}
.lname{flex:1;min-width:0;overflow-wrap:anywhere}
.addrow{display:flex;gap:8px;margin-top:10px}
.btn{flex:none;border:0;border-radius:12px;background:var(--route);color:#fff;padding:0 16px;font-weight:700}
.filter{width:100%;margin-bottom:10px}
.note{color:var(--muted);font-size:15px;padding:14px}
.ver{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 0;opacity:.8}
.ver a{color:inherit}

/* Sheet */
dialog{border:0;border-radius:18px 18px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));
  width:100%;max-width:640px;margin:auto auto 0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,30,.45)}
dialog h3{margin:0 0 4px;font-size:20px}
dialog p{margin:0 0 14px;color:var(--muted);font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:2px solid var(--line);background:none;text-align:left}
.opt i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--cat)}
.opt.on{border-color:var(--cat)}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:12px;border-radius:12px;border:0}
.del{background:var(--danger-bg);color:var(--danger)}
.cancel{background:var(--bg)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:608px;margin:0 auto;z-index:10;
  display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 6px 6px 16px;overflow:hidden;
  background:#16212C;color:#F3F5F7;border-radius:14px;font-size:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .18s,transform .18s}
@media (prefers-color-scheme:dark){.toast{background:#2A3A4A;box-shadow:0 6px 20px rgba(0,0,0,.5)}}
.toast.show{opacity:1;transform:none;pointer-events:auto}
#toastMsg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 0}
.toast button{flex:none;background:none;border:0;color:var(--marker);font-weight:700;padding:10px 12px;border-radius:10px}
.toast button:active{background:rgba(255,255,255,.08)}
.toast .timer{position:absolute;left:0;bottom:0;height:3px;background:var(--marker);width:100%;transform-origin:left}
.toast.counting .timer{animation:countdown var(--dur) linear forwards}
@keyframes countdown{to{transform:scaleX(0)}}
.undo{flex-direction:column;align-items:stretch;gap:0;padding:0}
.undo-main{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 6px 6px 16px}
.undo-sum{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;color:inherit!important;font-weight:400!important;text-align:left;padding:8px 0!important}
.undo-sum span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.undo-sum .chev{flex:none;font-size:13px;opacity:.7;transition:transform .15s}
.undo.open .chev{transform:rotate(180deg)}
.undo-list{list-style:none;margin:0;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.12);max-height:40vh;overflow-y:auto}
.undo-list li{display:flex;align-items:center;gap:12px;padding:0 6px 0 16px;min-height:44px}
.undo-list li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.undo:not(.open) .undo-list{display:none}
.undo.open .timer{display:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.toast .timer{display:none}}
</style>
</head>
<body>
<header>
  <h1 id="title">Boodschappen</h1>
  <div class="head-r">
    <span class="count" id="count"></span>
  </div>
</header>
<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-view="list" aria-selected="true">Lijst</button>
  <button class="tab" role="tab" data-view="history" aria-selected="false">Historie</button>
  <button class="tab" role="tab" data-view="settings" aria-selected="false">Aanpassen</button>
</nav>
<main id="main"></main>

<form id="form" autocomplete="off">
  <div class="sugs" id="sugs" role="listbox" aria-label="Eerder getypt"></div>
  <div class="bar">
    <input id="input" placeholder="Wat moet je halen?" aria-label="Product toevoegen" enterkeyhint="done">
    <button class="add" aria-label="Toevoegen">+</button>
  </div>
</form>

<dialog id="sheet">
  <h3 id="sheetTitle"></h3>
  <p>Kies waar dit ligt. Volgende keer komt het meteen op die plek.</p>
  <div class="opts" id="opts"></div>
  <div class="addrow">
    <input id="newCatSheet" placeholder="Nieuwe categorie, bijv. Diepvries" aria-label="Nieuwe categorie">
    <button class="btn" id="newCatSheetBtn">Maak</button>
  </div>
  <div class="row">
    <button class="del" id="del">Van lijst halen</button>
    <button class="cancel" id="cancel">Sluiten</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastBtn" hidden></button><span class="timer" id="toastTimer" hidden></span></div>
<div class="toast undo" id="undo" role="status">
  <ul class="undo-list" id="undoList" aria-label="Net afgevinkt"></ul>
  <div class="undo-main">
    <button class="undo-sum" id="undoSum" aria-expanded="false"><span id="undoMsg"></span><i class="chev" id="undoChev" aria-hidden="true">▲</i></button>
    <button id="undoAll"></button>
  </div>
  <span class="timer"></span>
</div>

<script>
const $ = s => document.querySelector(s);
const PALETTE = ["#3E8E41","#7BB33A","#C8423B","#4A90D9","#C98A2E","#1FA3A3","#8A7FA8","#D4537E","#E07B24","#5B6BD6","#2E8B6E","#9C6B3F"];
let cats = [], items = [], learned = [], current = null, view = "list", filter = "";
let sugs = [], shownSugs = [], hl = -1, hist = [], appVersion = "";

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { toast(data.error || "Opslaan lukte niet. Probeer het opnieuw."); throw new Error(data.error); }
  return data;
}
const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
const catOf = key => cats.find(c => c.key === key) || cats[cats.length - 1];
let toastT;
/* ---------- ongedaan maken: één balk voor alles wat je net hebt afgevinkt ---------- */
let pending = [], undoT, undoOpen = false;
const UNDO_MS = 6000;
function undoBottom() {
  const form = $("#form"), formH = getComputedStyle(form).display === "none" ? 0 : form.offsetHeight;
  return formH ? `${formH + 10}px` : "";
}
function renderUndo() {
  const u = $("#undo");
  if (!pending.length) { u.classList.remove("show", "counting", "open"); undoOpen = false; return; }
  const one = pending.length === 1;
  $("#undoMsg").textContent = one ? `${pending[0].name} afgevinkt` : `${pending.length} producten afgevinkt`;
  $("#undoChev").hidden = one;
  $("#undoSum").disabled = one;
  $("#undoSum").setAttribute("aria-expanded", undoOpen);
  $("#undoAll").textContent = one ? "Ongedaan maken" : "Alles terug";
  $("#undoList").innerHTML = pending.map((p, i) => `<li><span>${esc(p.name)}</span><button data-undo="${i}" aria-label="${esc(p.name)} terugzetten">Terug</button></li>`).join("");
  u.classList.toggle("open", undoOpen && !one);
  u.style.bottom = undoBottom();
  u.classList.add("show");
}
function restartUndoTimer() {
  const u = $("#undo");
  clearTimeout(undoT);
  u.classList.remove("counting"); void u.offsetWidth;
  u.style.setProperty("--dur", UNDO_MS + "ms");
  if (undoOpen) return; // uitgeklapt: blijft staan tot je hem weer inklapt
  u.classList.add("counting");
  undoT = setTimeout(() => { pending = []; renderUndo(); }, UNDO_MS);
}
function addPending(name, pid) {
  pending.push({ name, pid });
  renderUndo(); restartUndoTimer();
}
async function undoMany(list) {
  for (const p of list) items = await api(`/api/history/${p.pid}/undo`, { method: "POST" });
  pending = pending.filter(p => !list.includes(p));
  render(); renderUndo(); if (pending.length) restartUndoTimer();
}
$("#undoSum").onclick = () => { if (pending.length < 2) return; undoOpen = !undoOpen; renderUndo(); restartUndoTimer(); };
$("#undoAll").onclick = () => { clearTimeout(undoT); undoOpen = false; undoMany([...pending]); };
$("#undoList").addEventListener("click", e => { const b = e.target.closest("[data-undo]"); if (b) undoMany([pending[+b.dataset.undo]]); });

function toast(msg, action) {
  const t = $("#toast"), b = $("#toastBtn"), timer = $("#toastTimer"), ms = action ? 5000 : 2600;
  $("#toastMsg").textContent = msg;
  b.hidden = timer.hidden = !action;
  if (action) { b.textContent = action.label; b.onclick = () => { t.classList.remove("show"); action.run(); }; }
  // net boven het invoerveld (en de suggesties) zweven, niet midden in de lijst
  const form = $("#form"), formH = getComputedStyle(form).display === "none" ? 0 : form.offsetHeight;
  const u = $("#undo"), undoH = u.classList.contains("show") ? u.offsetHeight + 8 : 0;
  t.style.bottom = formH || undoH ? `${formH + 10 + undoH}px` : "";
  t.classList.remove("counting"); void t.offsetWidth;
  t.style.setProperty("--dur", ms + "ms");
  t.classList.add("show"); if (action) t.classList.add("counting");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show", "counting"), ms);
}

/* ---------- lijst ---------- */
function renderList() {
  $("#count").textContent = items.length ? `${items.length} te halen` : "";
  if (!items.length) {
    $("#main").innerHTML = `<div class="empty"><strong>Je lijst is leeg</strong>Typ hieronder wat je nodig hebt. Het komt vanzelf in de juiste volgorde te staan. Wat je afvinkt, vind je terug onder Historie.</div>`;
    return;
  }
  let html = '<div class="route">';
  for (const c of cats) {
    const group = items.filter(i => i.category === c.key);
    if (!group.length) continue;
    html += `<section class="stop" style="--cat:${c.color}"><h2>${esc(c.label)}</h2><ul class="list">`;
    for (const i of group) html += `<li data-li="${i.id}">
        <button class="check" data-toggle="${i.id}" aria-label="${esc(i.name)} afvinken"><span class="box"></span><span class="name">${esc(i.name)}</span></button>
        <button class="more" data-more="${i.id}" aria-label="Categorie wijzigen voor ${esc(i.name)}">⋯</button></li>`;
    html += "</ul></section>";
  }
  html += "</div>";
  $("#main").innerHTML = html;
}

/* ---------- aanpassen ---------- */
function renderSettings() {
  $("#count").textContent = "";
  const catRows = cats.map((c, i) => {
    const fixed = c.key === "overig";
    return `<li style="--cat:${c.color}">
      <button class="sw" data-color="${i}" aria-label="Andere kleur voor ${esc(c.label)}"></button>
      <input value="${esc(c.label)}" data-label="${i}" aria-label="Naam van categorie">
      <button class="ic" data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="Eerder in de route">↑</button>
      <button class="ic" data-down="${i}" ${i === cats.length - 1 ? "disabled" : ""} aria-label="Later in de route">↓</button>
      <button class="ic x" data-delcat="${i}" ${fixed ? "disabled" : ""} aria-label="Categorie verwijderen">✕</button></li>`;
  }).join("");
  const opts = sel => cats.map(c => `<option value="${c.key}"${c.key === sel ? " selected" : ""}>${esc(c.label)}</option>`).join("");
  const shown = learned.filter(l => l.name.includes(filter.toLowerCase()));
  const learnedRows = shown.length ? shown.map(l => `<li style="--cat:${catOf(l.category).color}">
      <span class="lname">${esc(l.name)}</span>
      <select data-learn="${esc(l.name)}" aria-label="Categorie voor ${esc(l.name)}" style="flex:0 1 46%">${opts(l.category)}</select>
      <button class="ic x" data-forget="${esc(l.name)}" aria-label="${esc(l.name)} vergeten">✕</button></li>`).join("")
    : `<li class="note">${learned.length ? "Geen product gevonden met die naam." : "Nog niets onthouden. Verplaats een product via ⋯ op je lijst, of voeg er hieronder een toe."}</li>`;

  $("#main").innerHTML = `
    <section class="sec">
      <h2>Looproute</h2>
      <p>Zet de categorieën in de volgorde waarin je door de winkel loopt. Tik op het bolletje voor een andere kleur.</p>
      <ul class="rows">${catRows}</ul>
      <div class="addrow"><input id="newCat" placeholder="Bijv. Diepvries" aria-label="Nieuwe categorie"><button class="btn" id="newCatBtn">Toevoegen</button></div>
    </section>
    <section class="sec">
      <h2>Onthouden producten</h2>
      <p>Hier staan producten die je zelf een plek hebt gegeven. Die keuze gaat altijd voor de automatische indeling.</p>
      <input class="filter" id="filter" placeholder="Zoek product" value="${esc(filter)}" aria-label="Zoek in onthouden producten">
      <ul class="rows">${learnedRows}</ul>
      <div class="addrow">
        <input id="newLearn" placeholder="Product, bijv. hummus" aria-label="Productnaam">
        <select id="newLearnCat" aria-label="Categorie" style="flex:0 1 40%">${opts("overig")}</select>
      </div>
      <div class="addrow"><button class="btn" id="newLearnBtn" style="flex:1;padding:12px">Product onthouden</button></div>
    </section>
    <p class="ver">${appVersion ? (/^\d/.test(appVersion)
      ? `<a href="https://github.com/RichrdJ/boodschappenlijst/releases/tag/v${esc(appVersion)}" target="_blank" rel="noopener">Versie ${esc(appVersion)}</a>`
      : `Versie ${esc(appVersion)}`) : ""}</p>`;
}

/* ---------- historie ---------- */
const dayKey = ts => { const d = new Date(ts * 1000); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
function dayLabel(ts) {
  const d = new Date(ts * 1000), today = new Date(), y = new Date(); y.setDate(today.getDate() - 1);
  if (dayKey(ts) === dayKey(today / 1000)) return "Vandaag";
  if (dayKey(ts) === dayKey(y / 1000)) return "Gisteren";
  return d.toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long", ...(d.getFullYear() !== today.getFullYear() && { year: "numeric" }) });
}
function renderHistory() {
  $("#count").textContent = "";
  if (!hist.length) {
    $("#main").innerHTML = `<div class="empty"><strong>Nog geen historie</strong>Vink iets af op je lijst, dan zie je het hier terug per dag.</div>`;
    return;
  }
  const days = [];
  for (const p of hist) {
    const k = dayKey(p.bought);
    if (!days.length || days[days.length - 1].key !== k) days.push({ key: k, ts: p.bought, rows: [] });
    days[days.length - 1].rows.push(p);
  }
  $("#main").innerHTML = days.map((d, di) => `<section class="day">
    <div class="day-h"><div><h2>${dayLabel(d.ts)}</h2><small>${d.rows.length} ${d.rows.length === 1 ? "product" : "producten"}</small></div>
      <button class="again" data-dayadd="${di}">Alles weer op de lijst</button></div>
    <ul class="rows">${d.rows.map(p => `<li class="hrow" style="--cat:${catOf(p.category).color}">
      <span class="dot" aria-hidden="true"></span>
      <span class="lname">${esc(p.name)}</span>
      <span class="t">${new Date(p.bought * 1000).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" })}</span>
      <button class="ic plus" data-readd="${p.id}" aria-label="${esc(p.name)} weer op de lijst">+</button>
      <button class="ic x" data-hdel="${p.id}" aria-label="${esc(p.name)} uit historie verwijderen">✕</button></li>`).join("")}</ul>
  </section>`).join("");
  window._days = days;
}
async function readd(names) {
  const r = await api("/api/history/readd", { method: "POST", body: JSON.stringify({ names }) });
  items = r.items;
  if (!r.added) toast(names.length === 1 ? `${names[0]} staat al op je lijst` : "Alles staat al op je lijst");
  else toast(names.length === 1 ? `${names[0]} staat weer op je lijst` : `${r.added} ${r.added === 1 ? "product" : "producten"} weer op je lijst`);
}

function render() { ({ list: renderList, history: renderHistory, settings: renderSettings })[view](); }

async function saveCats() { cats = await api("/api/categories", { method: "PUT", body: JSON.stringify(cats) }); render(); }

/* ---------- data ---------- */
async function load() {
  try { [cats, items] = await Promise.all([api("/api/categories"), api("/api/items")]); if (view === "list") render(); } catch (e) {}
}
async function loadSuggestions() {
  try { sugs = await api("/api/suggestions"); renderSugs(); } catch (e) {}
}

/* ---------- herkenning: eerder getypte producten ---------- */
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/^\s*\d+[.,]?\d*\s*(x|st|stuks|kg|g|gr|gram|l|liter|ml|pak|zak|bos)?\s+/, "").trim();
const onList = name => items.some(i => norm(i.name) === norm(name));

function matchScore(name, q) {
  const n = norm(name);
  if (n === q) return 100;
  if (n.startsWith(q)) return 80;
  if (n.split(/[\s-]+/).some(w => w.startsWith(q))) return 60;
  if (n.includes(q)) return 30;
  return 0;
}

function renderSugs() {
  const raw = $("#input").value, q = norm(raw);
  if (!q) {
    // Leeg invoerveld: laat zien wat je vaak koopt en nog niet op de lijst staat
    shownSugs = document.activeElement === $("#input") ? sugs.filter(s => !onList(s.name)).slice(0, 8) : [];
  } else {
    shownSugs = sugs.map(s => ({ ...s, score: matchScore(s.name, q) }))
      .filter(s => s.score > 0 && !(s.score === 100 && raw.trim() === s.name))
      .sort((a, b) => b.score - a.score || b.uses - a.uses).slice(0, 6);
  }
  hl = Math.min(hl, shownSugs.length - 1);
  const label = !q && shownSugs.length ? '<span class="sug-label">Vaak gekocht</span>' : "";
  $("#sugs").innerHTML = label + shownSugs.map((s, i) => {
    const c = catOf(s.category), n = esc(s.name);
    const t = raw.trim().toLowerCase(), idx = t ? s.name.toLowerCase().indexOf(t) : -1;
    const shown = idx >= 0 ? esc(s.name.slice(0, idx)) + "<b>" + esc(s.name.slice(idx, idx + t.length)) + "</b>" + esc(s.name.slice(idx + t.length)) : n;
    return `<span class="chip${i === hl ? " hl" : ""}${onList(s.name) ? " on-list" : ""}" role="option" aria-selected="${i === hl}">
      <button type="button" class="chip-add" data-sug="${i}" style="--cat:${c.color}" aria-label="${n} toevoegen${onList(s.name) ? ", staat al op je lijst" : ""}"><i></i><span>${shown}</span></button>
      <button type="button" class="chip-x" data-sugdel="${i}" aria-label="${n} niet meer voorstellen">✕</button></span>`;
  }).join("");
}

async function addItem(name) {
  if (onList(name)) { toast(`${name} staat al op je lijst`); return; }
  items = await api("/api/items", { method: "POST", body: JSON.stringify({ name }) });
  const added = items[items.map(i => i.name).lastIndexOf(name)];
  if (added) toast(`${name} staat bij ${catOf(added.category).label}`);
  render(); loadSuggestions();
}

$("#input").addEventListener("input", () => { hl = -1; renderSugs(); });
$("#input").addEventListener("focus", renderSugs);
$("#input").addEventListener("blur", () => setTimeout(() => { if (document.activeElement?.closest?.("#sugs")) return; if (!$("#input").value) { shownSugs = []; $("#sugs").innerHTML = ""; } }, 150));
$("#input").addEventListener("keydown", e => {
  if (!shownSugs.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowRight" && hl >= 0) { e.preventDefault(); hl = (hl + 1) % shownSugs.length; renderSugs(); }
  else if (e.key === "ArrowUp" || e.key === "ArrowLeft" && hl >= 0) { e.preventDefault(); hl = (hl - 1 + shownSugs.length) % shownSugs.length; renderSugs(); }
  else if (e.key === "Tab" && $("#input").value) { e.preventDefault(); $("#input").value = shownSugs[Math.max(hl, 0)].name; hl = -1; renderSugs(); }
  else if (e.key === "Escape") { hl = -1; $("#sugs").innerHTML = ""; shownSugs = []; }
});
$("#sugs").addEventListener("pointerdown", e => e.preventDefault()); // toetsenbord blijft open
$("#sugs").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.sug !== undefined) {
    const s = shownSugs[+b.dataset.sug]; $("#input").value = ""; hl = -1;
    await addItem(s.name); $("#input").focus(); renderSugs();
  } else if (b.dataset.sugdel !== undefined) {
    const s = shownSugs[+b.dataset.sugdel];
    sugs = await api(`/api/suggestions/${encodeURIComponent(s.name)}`, { method: "DELETE" });
    renderSugs(); toast(`${s.name} wordt niet meer voorgesteld`);
  }
});

/* ---------- events ---------- */
async function setView(v) {
  view = v;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === v));
  document.body.classList.toggle("settings", v !== "list");
  if (v === "settings") learned = await api("/api/learned");
  if (v === "history") hist = await api("/api/history");
  if (v === "list") items = await api("/api/items");
  render(); renderUndo(); window.scrollTo(0, 0);
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setView(t.dataset.view));

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const name = hl >= 0 && shownSugs[hl] ? shownSugs[hl].name : $("#input").value.trim();
  if (!name) return;
  $("#input").value = ""; hl = -1;
  await addItem(name); renderSugs();
});

$("#main").addEventListener("click", async e => {
  const d = e.target.closest("button")?.dataset || {};
  if (d.toggle) {
    const it = items.find(i => i.id == d.toggle);
    const li = it && document.querySelector(`[data-li="${it.id}"]`);
    if (!li || li.classList.contains("leaving")) return;
    li.classList.add("checked", "leaving");
    const req = api(`/api/items/${it.id}`, { method: "PATCH", body: JSON.stringify({ checked: true }) });
    await new Promise(r => setTimeout(r, 450));
    const r = await req; items = r.items; render();
    addPending(it.name, r.purchase_id);
  } else if (d.more) {
    current = items.find(i => i.id == d.more); openSheet();
  } else if (d.readd) {
    await readd([hist.find(p => p.id == d.readd).name]);
  } else if (d.dayadd) {
    await readd([...new Set(window._days[+d.dayadd].rows.map(p => p.name))]);
  } else if (d.hdel) {
    hist = await api(`/api/history/${d.hdel}`, { method: "DELETE" }); render();
  } else if (d.up || d.down) {
    const i = +(d.up ?? d.down), j = d.up ? i - 1 : i + 1;
    [cats[i], cats[j]] = [cats[j], cats[i]]; await saveCats();
    document.querySelector(`[data-${d.up ? "up" : "down"}="${j}"]`)?.focus();
  } else if (d.color) {
    const c = cats[+d.color]; c.color = PALETTE[(PALETTE.indexOf(c.color) + 1) % PALETTE.length]; await saveCats();
  } else if (d.delcat) {
    const c = cats[+d.delcat];
    if (!confirm(`${c.label} verwijderen? Producten in deze categorie gaan naar Overig.`)) return;
    cats.splice(+d.delcat, 1); await saveCats(); learned = await api("/api/learned"); render(); toast(`${c.label} verwijderd`);
  } else if (d.forget) {
    learned = await api(`/api/learned/${encodeURIComponent(d.forget)}`, { method: "DELETE" }); render(); toast(`${d.forget} vergeten`);
  } else if (e.target.id === "newCatBtn") {
    const label = $("#newCat").value.trim(); if (!label) return toast("Geef de categorie een naam");
    cats = await api("/api/categories", { method: "POST", body: JSON.stringify({ label }) }); render(); toast(`${label} toegevoegd`);
  } else if (e.target.id === "newLearnBtn") {
    const name = $("#newLearn").value.trim(); if (!name) return toast("Vul een productnaam in");
    learned = await api("/api/learned", { method: "PUT", body: JSON.stringify({ name, category: $("#newLearnCat").value }) });
    render(); toast(`${name} onthouden`);
  }
});

$("#main").addEventListener("change", async e => {
  const d = e.target.dataset;
  if (d.label !== undefined) { cats[+d.label].label = e.target.value; await saveCats(); toast("Naam opgeslagen"); }
  if (d.learn) {
    learned = await api("/api/learned", { method: "PUT", body: JSON.stringify({ name: d.learn, category: e.target.value }) });
    render(); toast(`${d.learn} staat nu bij ${catOf(e.target.value).label}`);
  }
});
$("#main").addEventListener("input", e => {
  if (e.target.id === "filter") { filter = e.target.value; const pos = e.target.selectionStart; render(); const f = $("#filter"); f.focus(); f.setSelectionRange(pos, pos); }
});
$("#main").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "newCat") $("#newCatBtn").click();
  if (e.target.id === "newLearn") $("#newLearnBtn").click();
});

/* ---------- sheet ---------- */
function openSheet() {
  $("#sheetTitle").textContent = current.name;
  $("#opts").innerHTML = cats.map(c => `<button class="opt${c.key === current.category ? " on" : ""}" data-cat="${c.key}" style="--cat:${c.color}"><i></i>${esc(c.label)}</button>`).join("");
  $("#newCatSheet").value = "";
  if (!$("#sheet").open) $("#sheet").showModal();
}
async function moveTo(key) {
  items = await api(`/api/items/${current.id}`, { method: "PATCH", body: JSON.stringify({ category: key }) });
  $("#sheet").close(); render(); toast(`Onthouden: ${current.name} hoort bij ${catOf(key).label}`);
}
$("#opts").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (b) moveTo(b.dataset.cat); });
$("#newCatSheetBtn").onclick = async () => {
  const label = $("#newCatSheet").value.trim(); if (!label) return toast("Geef de categorie een naam");
  const before = new Set(cats.map(c => c.key));
  cats = await api("/api/categories", { method: "POST", body: JSON.stringify({ label }) });
  await moveTo(cats.find(c => !before.has(c.key)).key);
};
$("#newCatSheet").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#newCatSheetBtn").click(); } });
$("#del").onclick = async () => { items = await api(`/api/items/${current.id}`, { method: "DELETE" }); $("#sheet").close(); render(); };
$("#cancel").onclick = () => $("#sheet").close();

(async () => {
  await load(); loadSuggestions();
  api("/api/version").then(v => appVersion = v.version).catch(() => {});
  setInterval(() => { if (!document.hidden && !$("#sheet").open && view === "list") load(); }, 4000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && view === "list") load(); });
})();
</script>
</body>
