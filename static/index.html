<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A4FA3">
<title>Boodschappen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#16212C; --muted:#6B7785; --line:#D5DCE3;
  --route:#0A4FA3; --marker:#FFD23F; --danger:#A3261E; --danger-bg:#FCE8E6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F161D;--surface:#18222C;--ink:#E8EDF2;--muted:#8D9AA8;--line:#2A3642;--route:#5B9BEA;--danger:#FFB4AC;--danger-bg:#3A1E1C}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
/* geen dubbeltik-zoom op iOS bij snel afvinken; knijpen om te zoomen blijft werken */
html,button,input,select,a{touch-action:manipulation}
button{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);
  font:17px/1.4 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.settings{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:20px 20px 8px;max-width:640px;margin:0 auto}
h1{font-size:28px;margin:0;letter-spacing:-.01em;min-width:0}
.head-l{min-width:0}
#listBtn{display:flex;align-items:center;gap:6px;max-width:100%;background:none;border:0;padding:0;font:inherit;text-align:left}
#listBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#listBtn i{flex:none;font-style:normal;font-size:16px;color:var(--muted)}
.together{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.together:empty{display:none}
.lopts{display:grid;gap:8px}
.lopt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:none;text-align:left}
.lopt.on{border-color:var(--route)}
.lopt span{min-width:0}
.lopt b{display:block;overflow-wrap:anywhere}
.lopt small{color:var(--muted);font-size:14px;flex:none}
.head-r{flex:none;display:flex;align-items:center;gap:12px}
.count{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:4px;max-width:640px;margin:0 auto 12px;padding:4px;background:var(--line);border-radius:14px;width:calc(100% - 32px)}
.tab{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700}
main{max-width:640px;margin:0 auto;padding:4px 16px 0}

.route{position:relative;padding-left:30px}
.route::before{content:"";position:absolute;left:10px;top:14px;bottom:14px;width:4px;border-radius:2px;background:var(--route);opacity:.25}
.stop{position:relative;margin-bottom:18px}
.stop>h2{position:relative;font-size:15px;font-weight:700;margin:0 0 6px;padding-top:4px;color:var(--muted)}
.stop>h2::before{content:"";position:absolute;left:-26px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--cat);border:3px solid var(--bg)}
.stop.done>h2::before{background:var(--line)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:0 14px 14px 0;overflow:hidden;border-left:4px solid var(--cat)}
.list li{display:flex;align-items:center;min-height:52px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.check{flex:1;display:flex;align-items:center;gap:14px;padding:12px 14px;background:none;border:0;text-align:left;min-width:0}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
li.checked .box{background:var(--cat);border-color:var(--cat)}
li.leaving{opacity:0;transition:opacity .3s .15s}
li.checked .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.name{overflow-wrap:anywhere}
li.checked .name{text-decoration:line-through;color:var(--muted)}
.more{flex:none;width:48px;height:52px;background:none;border:0;color:var(--muted);font-size:22px}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty strong{display:block;color:var(--ink);font-size:20px;margin-bottom:4px}
.day{margin-bottom:22px}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 6px}
.day-h h2{font-size:17px;margin:0}
.day-h small{color:var(--muted);font-size:14px}
.again{background:none;border:0;color:var(--route);font-size:15px;font-weight:700;padding:6px 0}
.hrow .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--cat)}
.hrow .t{flex:none;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.hrow .ic.plus{color:var(--route);font-size:22px}

#form{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
body.settings #form{display:none}
.bar{display:flex;gap:10px;max-width:640px;margin:0 auto}
input,select{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--route)}
.sugs{display:flex;gap:8px;overflow-x:auto;max-width:640px;margin:0 auto;padding:0 0 10px;scrollbar-width:none}
.sugs:empty{display:none}
.sugs::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;border-radius:999px;border:2px solid var(--line);background:var(--bg);max-width:70vw}
.chip.hl{border-color:var(--route)}
.chip.on-list{opacity:.55}
.chip-add{display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px 4px 8px 12px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-add i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--cat)}
.chip-add b{font-weight:700}
.chip-x{background:none;border:0;color:var(--muted);padding:8px 12px 8px 6px;font-size:14px}
.sug-label{flex:none;align-self:center;color:var(--muted);font-size:14px;padding-right:2px}
.add{flex:none;width:54px;border:0;border-radius:12px;background:var(--marker);color:#16212C;font-size:28px;font-weight:700}
button:focus-visible{outline:3px solid var(--route);outline-offset:2px}

/* Instellingen */
.sec{margin-bottom:28px}
.sec h2{font-size:20px;margin:0 0 4px}
.sec>p{margin:0 0 12px;color:var(--muted);font-size:15px}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.rows li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.sw{flex:none;width:34px;height:34px;padding:0;border-radius:50%;border:3px solid var(--surface);background:var(--cat);outline:2px solid var(--line)}
.rows input,.rows select{padding:9px 10px}
.ic{flex:none;width:38px;height:38px;border-radius:10px;border:0;background:var(--bg);font-size:18px}
.ic:disabled{opacity:.3;cursor:default}
.ic.x{color:var(--danger)}
.lname{flex:1;min-width:0;overflow-wrap:anywhere}
.addrow{display:flex;gap:8px;margin-top:10px}
.btn{flex:none;border:0;border-radius:12px;background:var(--route);color:#fff;padding:0 16px;font-weight:700}
.filter{width:100%;margin-bottom:10px}
.note{color:var(--muted);font-size:15px;padding:14px}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.lname small{color:var(--muted);font-size:14px}
.lname .sub{display:block}
.tag{flex:none;color:var(--muted);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.rows li:has(.lname){min-height:54px}
.ver{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 0;opacity:.8}
.ver a{color:inherit}

/* Sheet */
dialog{border:0;border-radius:18px 18px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));
  width:100%;max-width:640px;margin:auto auto 0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,30,.45)}
dialog h3{margin:0 0 4px;font-size:20px}
dialog p{margin:0 0 14px;color:var(--muted);font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:2px solid var(--line);background:none;text-align:left}
.opt i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--cat)}
.opt.on{border-color:var(--cat)}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:12px;border-radius:12px;border:0}
.del{background:var(--danger-bg);color:var(--danger)}
.cancel{background:var(--bg)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:608px;margin:0 auto;z-index:10;
  display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 6px 6px 16px;overflow:hidden;
  background:#16212C;color:#F3F5F7;border-radius:14px;font-size:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .18s,transform .18s}
@media (prefers-color-scheme:dark){.toast{background:#2A3A4A;box-shadow:0 6px 20px rgba(0,0,0,.5)}}
.toast.show{opacity:1;transform:none;pointer-events:auto}
#toastMsg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 0}
.toast button{flex:none;background:none;border:0;color:var(--marker);font-weight:700;padding:10px 12px;border-radius:10px}
.toast button:active{background:rgba(255,255,255,.08)}
.toast .timer{position:absolute;left:0;bottom:0;height:3px;background:var(--marker);width:100%;transform-origin:left}
.toast.counting .timer{animation:countdown var(--dur) linear forwards}
@keyframes countdown{to{transform:scaleX(0)}}
.undo{flex-direction:column;align-items:stretch;gap:0;padding:0}
.undo-main{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 6px 6px 16px}
.undo-sum{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;color:inherit!important;font-weight:400!important;text-align:left;padding:8px 0!important}
.undo-sum span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.undo-sum .chev{flex:none;font-size:13px;opacity:.7;transition:transform .15s}
.undo.open .chev{transform:rotate(180deg)}
.undo-list{list-style:none;margin:0;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.12);max-height:40vh;overflow-y:auto}
.undo-list li{display:flex;align-items:center;gap:12px;padding:0 6px 0 16px;min-height:44px}
.undo-list li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.undo:not(.open) .undo-list{display:none}
.undo.open .timer{display:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.toast .timer{display:none}}
</style>
</head>
<body>
<header>
  <div class="head-l">
    <h1><button id="listBtn" aria-haspopup="dialog"><span id="listTitle">Boodschappen</span><i aria-hidden="true">▾</i></button></h1>
    <div class="together" id="together"></div>
  </div>
  <div class="head-r">
    <span class="count" id="count"></span>
  </div>
</header>
<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-view="list" aria-selected="true">Lijst</button>
  <button class="tab" role="tab" data-view="history" aria-selected="false">Historie</button>
  <button class="tab" role="tab" data-view="settings" aria-selected="false">Aanpassen</button>
</nav>
<main id="main"></main>

<form id="form" autocomplete="off">
  <div class="sugs" id="sugs" role="listbox" aria-label="Eerder getypt"></div>
  <div class="bar">
    <input id="input" placeholder="Wat moet je halen?" aria-label="Product toevoegen" enterkeyhint="done">
    <button class="add" aria-label="Toevoegen">+</button>
  </div>
</form>

<dialog id="sheet">
  <h3 id="sheetTitle"></h3>
  <p>Kies waar dit ligt. Volgende keer komt het meteen op die plek.</p>
  <div class="opts" id="opts"></div>
  <div class="addrow">
    <input id="newCatSheet" placeholder="Nieuwe categorie, bijv. Diepvries" aria-label="Nieuwe categorie">
    <button class="btn" id="newCatSheetBtn">Maak</button>
  </div>
  <div class="row">
    <button class="del" id="del">Van lijst halen</button>
    <button class="cancel" id="cancel">Sluiten</button>
  </div>
</dialog>

<dialog id="lists" aria-labelledby="listsTitle">
  <h3 id="listsTitle">Je lijsten</h3>
  <p>Deel een lijst via Aanpassen → Iemand uitnodigen.</p>
  <div class="lopts" id="listOpts"></div>
  <div class="addrow">
    <input id="newListName" placeholder="Nieuwe lijst, bijv. Weekend" aria-label="Naam van nieuwe lijst">
    <button class="btn" id="newListBtn">Maak</button>
  </div>
  <div class="row"><button class="cancel" id="listsClose">Sluiten</button></div>
</dialog>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastBtn" hidden></button><span class="timer" id="toastTimer" hidden></span></div>
<div class="toast undo" id="undo" role="status">
  <ul class="undo-list" id="undoList" aria-label="Net afgevinkt"></ul>
  <div class="undo-main">
    <button class="undo-sum" id="undoSum" aria-expanded="false"><span id="undoMsg"></span><i class="chev" id="undoChev" aria-hidden="true">▲</i></button>
    <button id="undoAll"></button>
  </div>
  <span class="timer"></span>
</div>

<script src="/static/app.js"></script>
</body>
</html>
