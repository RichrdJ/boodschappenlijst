<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A4FA3">
<title>Inloggen · Boodschappen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#16212C; --muted:#6B7785; --line:#D5DCE3;
  --route:#0A4FA3; --marker:#FFD23F; --danger:#A3261E;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F161D;--surface:#18222C;--ink:#E8EDF2;--muted:#8D9AA8;--line:#2A3642;--route:#5B9BEA;--danger:#FFB4AC}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
html,button,input{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;
  font:17px/1.4 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 20px}
main{width:100%;max-width:380px}
/* dezelfde looproute-lijn als op de lijst: van de titel naar het invoerveld */
.route{position:relative;padding-left:30px}
.route::before{content:"";position:absolute;left:10px;top:16px;bottom:30px;width:4px;border-radius:2px;background:var(--route);opacity:.25}
.stop{position:relative;margin:0 0 22px}
.stop::before{content:"";position:absolute;left:-26px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--route)}
.stop.end::before{background:var(--marker);box-shadow:0 0 0 3px var(--bg)}
h1{font-size:30px;margin:0;letter-spacing:-.01em;line-height:1.1}
p{margin:4px 0 0;color:var(--muted)}
label{display:block;font-weight:700;margin-bottom:8px}
.field{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:inherit;background:var(--surface);border:2px solid var(--line);
  border-radius:12px;padding:12px 14px}
input:focus{outline:none;border-color:var(--route)}
button{flex:none;font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--route);color:#fff;padding:0 18px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.err{color:var(--danger);margin:10px 0 0;min-height:1.4em;font-size:15px}
.show{background:none;color:var(--muted);font-weight:400;font-size:15px;padding:8px 0;margin-top:4px}
</style>
</head>
<body>
<main>
  <form class="route" id="form">
    <div class="stop">
      <h1>Boodschappen</h1>
      <p>Log in om je lijst te openen. Dit apparaat onthoudt het daarna.</p>
    </div>
    <div class="stop end">
      <label for="pw">Wachtwoord</label>
      <div class="field">
        <input id="pw" type="password" autocomplete="current-password" autofocus required>
        <button id="go" type="submit">Inloggen</button>
      </div>
      <button class="show" id="show" type="button" aria-pressed="false">Wachtwoord tonen</button>
      <p class="err" id="err" role="alert"></p>
    </div>
  </form>
</main>
<script>
const $ = s => document.querySelector(s);
$("#show").onclick = () => {
  const on = $("#pw").type === "password";
  $("#pw").type = on ? "text" : "password";
  $("#show").textContent = on ? "Wachtwoord verbergen" : "Wachtwoord tonen";
  $("#show").setAttribute("aria-pressed", on);
  $("#pw").focus();
};
$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  $("#go").disabled = true; $("#err").textContent = "";
  try {
    const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("#pw").value }) });
    const data = await res.json().catch(() => ({}));
    if (res.ok) { location.replace("/"); return; }
    $("#err").textContent = data.error || "Inloggen lukte niet. Probeer het opnieuw.";
    $("#pw").select();
  } catch {
    $("#err").textContent = "Geen verbinding met de server.";
  }
  $("#go").disabled = false;
});
</script>
</body>
</html>
