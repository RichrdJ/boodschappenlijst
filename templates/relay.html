<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bezig met inloggen</title></head>
<body>
<form id="f" method="post" action="/auth/apple/finish">
  {% for k, v in fields.items() %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
  <noscript><button>Doorgaan</button></noscript>
</form>
<script nonce="{{ nonce }}">document.getElementById("f").submit()</script>
</body>
</html>
